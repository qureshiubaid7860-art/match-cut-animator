[project]
name = "match-cut-animator"
version = "0.1.0"
description = "Match Cut Animator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4,<12.0",
    "rapidocr>=3.3,<4.0",
    "onnxruntime>=1.20,<2.0",
    "numpy>=2.0,<3.0",
    "pymupdf>=1.24,<2.0",
    "imageio-ffmpeg>=0.5.1,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
