[project]
name = "match-cut-animator"
version = "0.1.0"
description = "Match Cut Animator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0"
    "pillow>=10.4,<12.0",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]